openapi: 3.0.0
info:
  title: UlMind Internal Admin & Tracking API
  version: 1.0.0
  description: |
    ## Overview
    This API powers the UlMind internal admin panel and tracking system.

    ### Authentication Flow
    1. Call `POST /api/v1/auth/login` with your email and password.
    2. The response includes a `token` (JWT) and a `must_change_password` flag.
    3. **If `must_change_password` is `true`**, immediately redirect the user to change their password using `POST /api/v1/auth/change-password`.
    4. Store the JWT securely (e.g., in memory or an HttpOnly cookie — **never in localStorage**).
    5. For all protected endpoints, send the JWT in the `Authorization` header as: `Bearer <token>`.

    ### Protected Routes
    All `/api/v1/projects/**` routes require a valid Bearer token. Unauthenticated requests return `401 Unauthorized`.

    ### Token Expiry
    Tokens expire after **8 hours**. On expiry, redirect the user to login again.

servers:
  - url: /api/v1
    description: V1 API base path

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Obtain your token from `POST /api/v1/auth/login`.
        Then click **Authorize** above and paste it in as `Bearer <your_token>`.

  schemas:
    LoginResponse:
      type: object
      properties:
        token:
          type: string
          description: JWT token valid for 8 hours. Use this in the Authorization header for all protected routes.
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        must_change_password:
          type: boolean
          description: If true, user MUST change their password before accessing any other feature.
          example: true
        email:
          type: string
          description: The logged-in admin's email address.
          example: soumyajit.banerjee@ulmind.com

    AdminProfile:
      type: object
      properties:
        _id:
          type: string
          description: MongoDB ObjectId of the admin.
          example: 65f2a3b1e4b09c1a2f3d4e5f
        email:
          type: string
          example: soumyajit.banerjee@ulmind.com
        role:
          type: string
          example: admin
        must_change_password:
          type: boolean
          example: false
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Project:
      type: object
      properties:
        _id:
          type: string
          description: MongoDB ObjectId — use this as `id` in status update calls.
          example: 65f2a3b1e4b09c1a2f3d4e5f
        name:
          type: string
          example: UlMind Admin Panel
        description:
          type: string
          example: Internal dashboard for managing projects and credentials.
        status:
          type: string
          enum: [Planning, Active, On-Hold, Completed]
          description: |
            Current lifecycle status of the project.
            - **Planning**: project not yet started.
            - **Active**: actively being worked on.
            - **On-Hold**: paused temporarily.
            - **Completed**: fully done.
          example: Active
        manager_id:
          type: string
          description: ID or email of the assigned project manager.
          example: soumyajit.banerjee@ulmind.com
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Human-readable error message.
          example: Invalid credentials

paths:

  # ──────────────────────────────────────────
  # AUTH ROUTES
  # ──────────────────────────────────────────

  /auth/login:
    post:
      summary: Admin Login
      description: |
        Authenticates an admin with their email and password.
        
        **Flow:**
        - On success, returns a JWT token.
        - Always check the `must_change_password` flag.
        - If `must_change_password: true`, force the user to call `POST /auth/change-password` before anything else.
        
        **Initial credentials for all admins:**
        - Password: `ulmind@123`
        - Every admin must change this on first login.
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  example: soumyajit.banerjee@ulmind.com
                password:
                  type: string
                  example: ulmind@123
      responses:
        '200':
          description: Login successful. Store the token securely.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Missing email or password in the request body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Email and password are required
        '401':
          description: Wrong email or password.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Invalid credentials
        '500':
          description: Unexpected server error.

  /auth/change-password:
    post:
      summary: Change Admin Password
      description: |
        Allows a logged-in admin to change their password.
        
        **Must be called when `must_change_password: true` is returned from login.**
        
        After a successful password change:
        - `must_change_password` is set to `false` on the account.
        - The existing token remains valid — no need to re-login.
        - Minimum new password length: **8 characters**.
        
        **Authorization:** Requires Bearer token in header.
      tags: [Auth]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password:
                  type: string
                  description: The admin's current password (initial or last set password).
                  example: ulmind@123
                new_password:
                  type: string
                  description: The new password. Must be at least 8 characters.
                  example: MySecurePass@2026
      responses:
        '200':
          description: Password changed successfully.
          content:
            application/json:
              example:
                message: Password changed successfully
        '400':
          description: Missing fields or new password too short (< 8 chars).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: New password must be at least 8 characters
        '401':
          description: Invalid token or wrong current password.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Current password is incorrect
        '500':
          description: Unexpected server error.

  /auth/me:
    get:
      summary: Get Current Admin Profile
      description: |
        Returns the profile of the currently authenticated admin.
        
        Use this to:
        - Display the admin's name/email in the UI.
        - Check `must_change_password` status on app load.
        - Verify the token is still valid (if this returns 401, redirect to login).
        
        **Authorization:** Requires Bearer token in header.
      tags: [Auth]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Admin profile data. Password is never returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminProfile'
        '401':
          description: Token missing, invalid, or expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "Unauthorized: Invalid or expired token"
        '404':
          description: Admin account not found (should not happen in normal flow).

  # ──────────────────────────────────────────
  # PROJECT ROUTES  (All require Bearer token)
  # ──────────────────────────────────────────

  /projects:
    get:
      summary: Get All Projects
      description: |
        Returns a list of all projects in the system.
        
        **Authorization:** Admin JWT required.
        
        Use this to populate a projects dashboard or list view on the frontend.
      tags: [Projects]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Array of all projects. May be an empty array if no projects exist.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
        '401':
          description: Unauthorized — token missing or invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Failed to retrieve projects from the database.

    post:
      summary: Create a New Project
      description: |
        Creates a new project with the given details.
        
        **Authorization:** Admin JWT required.
        
        - Default status is `Planning` if not provided.
        - `manager_id` should be the ID or email of the responsible person.
        - The response returns the full created project object including its `_id`,
          which must be used for subsequent status updates.
      tags: [Projects]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, manager_id]
              properties:
                name:
                  type: string
                  description: Display name of the project.
                  example: UlMind Admin Dashboard
                description:
                  type: string
                  description: Optional description of what the project is about.
                  example: Internal tool to manage admins, projects, and credentials.
                manager_id:
                  type: string
                  description: ID or email of the project manager responsible for this project.
                  example: soumyajit.banerjee@ulmind.com
      responses:
        '201':
          description: Project created successfully. Returns the full project object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '401':
          description: Unauthorized — token missing or invalid.
        '500':
          description: Failed to create the project.

  /projects/{id}/status:
    patch:
      summary: Update Project Status
      description: |
        Updates the lifecycle status of a specific project.
        
        **Authorization:** Admin JWT required.
        
        **Allowed status values:**
        - `Planning` → project is being scoped/planned, not yet started.
        - `Active` → project is currently being worked on.
        - `On-Hold` → project is paused (e.g., waiting for approvals or resources).
        - `Completed` → project has been fully delivered.
        
        **How to use:**
        1. Get the project's `_id` from `GET /projects`.
        2. Send a PATCH request to `/projects/{id}/status` with the new status.
        3. The response returns the fully updated project object.
      tags: [Projects]
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: The MongoDB `_id` of the project to update.
          example: 65f2a3b1e4b09c1a2f3d4e5f
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [Planning, Active, On-Hold, Completed]
                  example: Active
      responses:
        '200':
          description: Status updated. Returns the full updated project object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '401':
          description: Unauthorized — token missing or invalid.
        '404':
          description: No project found with the given ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Project not found
        '500':
          description: Failed to update the project status.

  # ──────────────────────────────────────────
  # TRACKING (Public)
  # ──────────────────────────────────────────

  /track:
    post:
      summary: Submit Device Fingerprint & Tracking Data
      description: |
        Accepts exhaustive device fingerprint and user metadata from the frontend.
        This endpoint is **public** — no authentication required.
        
        **When to call:**
        - On page load or user interaction on the public-facing UlMind site.
        - Pass as much device/user data as available; all fields are optional except `consent_status`.
        
        **Geo-IP enrichment** is performed server-side based on the caller's IP address.
        
        **Rate limit:** 100 requests per IP per 15 minutes.
      tags: [Tracking]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [consent_status]
              properties:
                username:
                  type: string
                  description: Display name of the user, if known. Use "Guest" if unknown.
                  example: John Doe
                email:
                  type: string
                  description: Email of the user, if provided (e.g., from a form). Use "Unknown" if not available.
                  example: john@example.com
                consent_status:
                  type: string
                  enum: [accepted, declined, stealth]
                  description: |
                    Indicates if the user accepted tracking consent.
                    - `accepted`: user explicitly agreed.
                    - `declined`: user explicitly declined.
                    - `stealth`: no consent prompt shown (silent tracking).
                  example: accepted
                os:
                  type: string
                  example: Windows
                osVersion:
                  type: string
                  example: "11"
                platform:
                  type: string
                  example: Win32
                timestamp:
                  type: string
                  format: date-time
                  example: "2026-03-16T07:47:22.000Z"
      responses:
        '201':
          description: Tracking data received and stored successfully.
          content:
            application/json:
              example:
                message: Tracked successfully
        '400':
          description: Validation error — check that `consent_status` is one of the allowed values.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded — too many requests from this IP.
