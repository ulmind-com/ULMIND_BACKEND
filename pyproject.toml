description = "Exhaustive Tracking Backend for UlMind"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "motor>=3.3.2",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "PyJWT>=2.8.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.6",
    "httpx>=0.25.0",
    "uvicorn[standard]>=0.24.0",
    "cloudinary>=1.36.0",
    "bcrypt<4.0.0",
    "slowapi>=0.1.9",
    "cryptography>=42.0.0",
    "playwright>=1.40.0",
    "aiosmtplib>=5.1.2",
    "qrcode[pil]>=7.4.2",
]

[tool.uv]
dev-dependencies = []
